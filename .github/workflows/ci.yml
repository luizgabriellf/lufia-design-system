name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Check (typecheck, lint, stylelint, format, tests, contrast, motion rules, AI-docs drift)
        run: npm run check
      - name: Show formatting diff if verification fails
        if: failure()
        run: npx prettier scripts/check-next-consumer.mjs | diff -u scripts/check-next-consumer.mjs - || true
      - name: Coverage
        run: npm run test:coverage
      - name: Build package
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

  consumer:
    name: Next.js App Router consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Build distributable package
        run: npm run build
      - name: Test packed package in Next.js
        run: npm run test:consumer:next
        env:
          CI: "true"
