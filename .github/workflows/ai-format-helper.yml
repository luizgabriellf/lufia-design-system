name: Temporary Storybook MCP dependency sync
on:
  push:
    branches: [feat/agent-native-discovery]
    paths: [.github/workflows/ai-format-helper.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install version-matched MCP addon
        run: npm install --save-dev --save-exact @storybook/addon-mcp@10.6.6
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(storybook): add official MCP addon"
          git push origin HEAD:feat/agent-native-discovery
