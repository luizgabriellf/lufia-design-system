name: Deploy Storybook

# Deploys only after CI has succeeded on main. Pages itself is enabled by scripts/setup-repo-settings.sh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.guard.outputs.stale }}
    steps:
      # No explicit ref: a workflow_run workflow checks out the default branch, never a ref taken from the event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # If main moved on after CI ran, this commit is not the one CI verified. Skip; the newer push deploys itself.
      - id: guard
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "${CI_SHA}" ] && [ "$(git rev-parse HEAD)" != "${CI_SHA}" ]; then
            echo "main moved past the CI-verified commit; skipping"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.stale != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.guard.outputs.stale != 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - if: steps.guard.outputs.stale != 'true'
        run: npm ci
      - if: steps.guard.outputs.stale != 'true'
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /lufia-design-system/
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - if: steps.guard.outputs.stale != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    if: needs.build.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
