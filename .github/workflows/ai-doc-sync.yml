name: Temporary AI docs regeneration
on:
  push:
    branches: [feat/agent-native-discovery]
    paths: [.github/workflows/ai-doc-sync.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:ai-docs
      - name: Commit regenerated AI output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/
          git commit -m "build(ai): regenerate component knowledge"
          git push origin HEAD:feat/agent-native-discovery
