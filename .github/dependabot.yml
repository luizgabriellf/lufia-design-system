version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "vitest-axe", "jsdom"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "stylelint*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
