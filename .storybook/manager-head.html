<script>
  // The manager hard-codes a "Storybook" suffix on the tab title; swap it for the brand name.
  (function () {
    var BRAND = "Lufia Design System";
    function fix() {
      var title = document.title;
      var next = title.replace(/\s-\sStorybook$/, "");
      if (next === title) next = title.replace(/\s⋅\sStorybook$/, " ⋅ " + BRAND);
      if (next === "Storybook") next = BRAND;
      if (next !== title) document.title = next;
    }
    new MutationObserver(fix).observe(document.head, { subtree: true, childList: true, characterData: true });
    fix();
  })();
</script>
